[project]
name = "websearch-mcp"
version = "0.1.0"
description = "Local-first, zero-key web search MCP server: ddgs multi-engine search, reader-mode fetch, PDF, local cache, GitHub search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9,<2",
    "ddgs>=9",
    "httpx>=0.27",
    "html2text>=2024.2.26",
    "trafilatura>=2.0",
    "pypdf>=5",
]

[project.scripts]
websearch-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
